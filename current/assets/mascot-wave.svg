<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
  <!-- 书身：四周留出透明 padding，让 SVG 边缘更干净，避免抗锯齿"黑边"感 -->
  <rect x="8" y="16" width="48" height="36" rx="5" fill="#F7D75C"/>
  <!-- 左页（米白）撑满书身内部 -->
  <path d="M10 18H30C31 18 32 19 32 20V50H12C11 50 10 49 10 48V18Z" fill="#FFF8D8"/>
  <!-- 右页（纯白） -->
  <path d="M54 18H34C33 18 32 19 32 20V50H52C53 50 54 49 54 48V18Z" fill="#FFFFFF"/>
  <!-- 不用书脊线了，左右页颜色对比已经做了视觉分隔 -->
  <!-- 左眼（实心圆，深绿色） -->
  <circle cx="20" cy="30" r="3" fill="#2F8C73"/>
  <!-- 右眼 -->
  <circle cx="44" cy="30" r="3" fill="#2F8C73"/>
  <!-- 笑嘴（加粗） -->
  <path d="M26 38Q32 44 38 38" stroke="#2F8C73" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- 招手三道（加粗） -->
  <path d="M48 24L56 16M48 30L56 22M48 36L56 28" stroke="#2F8C73" stroke-width="3" stroke-linecap="round" fill="none"/>
</svg>