<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
    <title>幼小衔接识字游戏</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/svg+xml" href="assets/mascot.svg" />
    <link rel="icon" type="image/png" sizes="128x128" href="favicon.png" />
  </head>
  <body>
    <div class="stage">
      <div class="stage-canvas">
        <main class="app" aria-live="polite">
      <section id="lobby" class="screen active" aria-labelledby="lobby-title">
        <div class="topbar">
          <div>
            <p class="eyebrow">幼小衔接</p>
            <h1 id="lobby-title">识字小游戏</h1>
          </div>
          <div class="topbar-right">
            <button id="open-voice-picker" class="icon-button" type="button" aria-label="选声音" title="选声音">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
            </button>
            <!-- Phase 2A：mascot 从顶栏移到 lobby 主体右下角，作为"陪伴吉祥物" -->
          </div>
        </div>

        <div class="game-list">
          <button id="open-match" class="game-entry clickable focus-ring" type="button">
            <span class="entry-icon" aria-hidden="true">
              <img src="assets/icon-match.svg" alt="" />
            </span>
            <span class="entry-text">
              <span class="entry-title">识字消消乐</span>
              <span class="entry-copy">找一找相同的字</span>
            </span>
          </button>
          <button id="open-memory" class="game-entry clickable focus-ring" type="button">
            <span class="entry-icon" aria-hidden="true">
              <img src="assets/icon-memory.svg" alt="" />
            </span>
            <span class="entry-text">
              <span class="entry-title">识字翻翻乐</span>
              <span class="entry-copy">记一记，再翻出来</span>
            </span>
          </button>
          <button id="open-pinyin-friend" class="game-entry clickable focus-ring" type="button">
            <span class="entry-icon" aria-hidden="true">
              <img src="assets/icon-pinyin-friend.svg" alt="" />
            </span>
            <span class="entry-text">
              <span class="entry-title">拼音找朋友</span>
              <span class="entry-copy">听一听，选拼音</span>
            </span>
          </button>
          <button id="open-listen-card" class="game-entry clickable focus-ring" type="button">
            <span class="entry-icon" aria-hidden="true">
              <img src="assets/icon-listen-card.svg" alt="" />
            </span>
            <span class="entry-text">
              <span class="entry-title">听音点卡</span>
              <span class="entry-copy">听一听，点拼音</span>
            </span>
          </button>
          <button id="open-stroop-train" class="game-entry clickable focus-ring" type="button">
            <span class="entry-icon" aria-hidden="true">
              <img src="assets/icon-stroop-train.svg" alt="" />
            </span>
            <span class="entry-text">
              <span class="entry-title">看字识颜色</span>
              <span class="entry-copy">字是什么颜色</span>
            </span>
          </button>
        </div>

        <!-- Phase 2A：lobby 主体右下角浮动 mascot（letterbox 内） -->
        <img class="mascot-companion" src="assets/mascot-wave.svg" alt="小书本" />
      </section>

      <section id="setup" class="screen" aria-labelledby="setup-title">
        <div class="topbar compact">
          <button class="text-button" type="button" data-action="back-lobby">返回</button>
          <h2 id="setup-title">选择难度</h2>
        </div>

        <div class="difficulty-grid" role="list" aria-label="难度选择">
          <button class="difficulty" type="button" data-size="3">
            <strong>3 x 3</strong>
            <span>轻松开始</span>
          </button>
          <button class="difficulty" type="button" data-size="4">
            <strong>4 x 4</strong>
            <span>多认几个</span>
          </button>
          <button class="difficulty" type="button" data-size="5">
            <strong>5 x 5</strong>
            <span>挑战一下</span>
          </button>
          <button class="difficulty" type="button" data-size="6">
            <strong>6 x 6</strong>
            <span>越来越难</span>
          </button>
          <button class="difficulty" type="button" data-size="7">
            <strong>7 x 7</strong>
            <span>极限挑战</span>
          </button>
        </div>
      </section>

      <section id="game" class="screen" aria-labelledby="game-title">
        <div class="game-topbar">
          <button class="text-button" type="button" data-action="back-setup">换难度</button>
          <div>
            <p id="game-subtitle" class="eyebrow">识字消消乐</p>
            <h2 id="game-title">找到相同的字</h2>
          </div>
          <div class="game-topbar-right">
            <img class="mascot-host game-mascot" src="assets/mascot-wave.svg" alt="小书本" />
            <button id="replay-sound" class="round-button" type="button" aria-label="再听一遍">听</button>
          </div>
        </div>

        <div class="game-hud" aria-label="游戏状态">
          <span id="progress" class="hud-progress">0 / 0</span>
          <span id="timer" class="hud-timer">00:00</span>
          <span id="hint" class="hud-hint">点一个字，听一听</span>
        </div>

        <div id="board" class="board zone-primary" role="grid" aria-label="识字消消乐棋盘"></div>

        <!-- 看字识颜色：棋盘 + 待选 + 颜色条 -->
        <div id="stroop-host" class="stroop-host zone-stack" hidden>
          <div id="stroop-board" class="stroop-board zone-primary" role="grid" aria-label="看字识颜色棋盘"></div>
          <div id="stroop-select" class="stroop-select zone-secondary" role="grid" aria-label="待选区（依次填入棋盘每格的颜色）"></div>
          <div id="stroop-palette" class="stroop-palette zone-toolbar" role="group" aria-label="颜色条（选颜色填入待选）"></div>
        </div>

        <div id="quiz" class="quiz zone-stack" hidden>
          <div id="quiz-main" class="quiz-main zone-primary" aria-live="polite"></div>
          <div id="option-grid" class="option-grid zone-secondary" role="list" aria-label="拼音选项"></div>
        </div>

        <div id="complete-panel" class="complete-panel" hidden>
          <!-- Phase 4A: 奖杯 + 星星 + 统计 -->
          <div class="trophy-row" aria-hidden="true">
            <!-- 3 档奖杯，init 全部 hidden，完成时按档位显示 1 档 -->
            <div class="trophy" data-tier="bronze" hidden>
              <svg class="trophy-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M8 18c-4 0-4 10 0 10" stroke="#cd7f32" stroke-width="3" fill="none" stroke-linecap="round"/>
                <path d="M56 18c4 0 4 10 0 10" stroke="#cd7f32" stroke-width="3" fill="none" stroke-linecap="round"/>
                <path d="M16 12h32v18c0 8-7 14-16 14s-16-6-16-14V12z" fill="#cd7f32"/>
                <path d="M16 12h32v3H16z" fill="#e89858"/>
                <rect x="24" y="44" width="16" height="4" fill="#a6611f"/>
                <rect x="18" y="48" width="28" height="6" rx="1" fill="#8b4a0f"/>
                <text x="32" y="32" text-anchor="middle" font-size="14" font-weight="900" fill="#fff8d8" font-family="system-ui">3</text>
              </svg>
            </div>
            <div class="trophy" data-tier="silver" hidden>
              <svg class="trophy-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M8 18c-4 0-4 10 0 10" stroke="#c0c0c0" stroke-width="3" fill="none" stroke-linecap="round"/>
                <path d="M56 18c4 0 4 10 0 10" stroke="#c0c0c0" stroke-width="3" fill="none" stroke-linecap="round"/>
                <path d="M16 12h32v18c0 8-7 14-16 14s-16-6-16-14V12z" fill="#d4d4d4"/>
                <path d="M16 12h32v3H16z" fill="#f0f0f0"/>
                <rect x="24" y="44" width="16" height="4" fill="#a0a0a0"/>
                <rect x="18" y="48" width="28" height="6" rx="1" fill="#808080"/>
                <text x="32" y="32" text-anchor="middle" font-size="14" font-weight="900" fill="#fff" font-family="system-ui">2</text>
              </svg>
            </div>
            <div class="trophy" data-tier="gold" hidden>
              <svg class="trophy-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M8 18c-4 0-4 10 0 10" stroke="#f7d75c" stroke-width="3" fill="none" stroke-linecap="round"/>
                <path d="M56 18c4 0 4 10 0 10" stroke="#f7d75c" stroke-width="3" fill="none" stroke-linecap="round"/>
                <path d="M16 12h32v18c0 8-7 14-16 14s-16-6-16-14V12z" fill="#f7d75c"/>
                <path d="M16 12h32v3H16z" fill="#fff3a8"/>
                <rect x="24" y="44" width="16" height="4" fill="#d4a72c"/>
                <rect x="18" y="48" width="28" height="6" rx="1" fill="#a3780f"/>
                <text x="32" y="32" text-anchor="middle" font-size="14" font-weight="900" fill="#5a4500" font-family="system-ui">1</text>
              </svg>
            </div>
          </div>
          <!-- 3 颗星：完成时按 earned 数标记 -->
          <div class="star-row" aria-label="星星数">
            <svg class="star" data-star="1" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 2L14.85 8.5L22 9.27L16.5 14.14L18.18 21L12 17.27L5.82 21L7.5 14.14L2 9.27L9.15 8.5L12 2Z"/>
            </svg>
            <svg class="star" data-star="2" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 2L14.85 8.5L22 9.27L16.5 14.14L18.18 21L12 17.27L5.82 21L7.5 14.14L2 9.27L9.15 8.5L12 2Z"/>
            </svg>
            <svg class="star" data-star="3" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 2L14.85 8.5L22 9.27L16.5 14.14L18.18 21L12 17.27L5.82 21L7.5 14.14L2 9.27L9.15 8.5L12 2Z"/>
            </svg>
          </div>
          <p class="complete-title">都找到了</p>
          <p id="complete-stats" class="complete-stats">用时 00:00 · 成功率 0 / 0（0%）</p>
          <p id="best-record" class="complete-record" hidden>新纪录！</p>
          <div class="actions">
            <button id="play-again" class="primary-button" type="button">再玩一次</button>
            <button id="next-board" class="secondary-button" type="button" hidden>下一关</button>
            <button class="secondary-button" type="button" data-action="back-lobby">回大厅</button>
          </div>
        </div>
      </section>
    </main>
      </div>
    </div>

    <!-- Voice picker modal: body-level, position:fixed, NOT inside .stage-canvas (避免被 transform scale 压住) -->
    <div id="voice-picker" class="voice-modal" hidden role="dialog" aria-labelledby="voice-picker-title" aria-modal="true">
      <div class="voice-modal-backdrop" data-close="voice-picker"></div>
      <div class="voice-modal-panel">
        <div class="voice-modal-head">
          <h2 id="voice-picker-title">选个喜欢的声音</h2>
          <button class="icon-button icon-button-sm" type="button" data-close="voice-picker" aria-label="关闭">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
          </button>
        </div>
        <p class="voice-modal-hint">点一行试听，喜欢就定了</p>
        <div id="voice-list" class="voice-list" role="list"></div>
      </div>
    </div>

    <script src="assets/audio/manifest.js"></script>
    <script src="scripts/stage.js"></script>
    <script src="app.js" defer></script>
  </body>
</html>
