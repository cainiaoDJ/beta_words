<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
    <title>幼小衔接识字游戏</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/svg+xml" href="assets/mascot.svg" />
    <link rel="icon" type="image/png" sizes="128x128" href="favicon.png" />
  </head>
  <body>
    <div class="stage">
      <!-- Phase 6A: letterbox 3 层 parallax SVG 背景（每个游戏/场景 1 个） -->
      <div class="letterbox-bg" data-bg="lobby" aria-hidden="true">
        <!-- Layer 1 远景：暖云朵 + 太阳光晕（60s 漂）-->
        <svg class="bg-layer bg-layer-1" viewBox="0 0 320 800" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
          <circle cx="30" cy="40" r="12" fill="#fff8d8" opacity="0.6"/>
          <ellipse cx="80" cy="50" rx="20" ry="8" fill="#f5e8c5" opacity="0.5"/>
          <circle cx="160" cy="30" r="10" fill="#fff8d8" opacity="0.55"/>
          <ellipse cx="220" cy="55" rx="18" ry="7" fill="#f5e8c5" opacity="0.5"/>
          <circle cx="280" cy="35" r="11" fill="#fff8d8" opacity="0.6"/>
          <!-- 下半 letterbox 也分布云朵 -->
          <circle cx="60" cy="700" r="12" fill="#fff8d8" opacity="0.6"/>
          <ellipse cx="120" cy="720" rx="18" ry="7" fill="#f5e8c5" opacity="0.5"/>
          <circle cx="220" cy="710" r="10" fill="#fff8d8" opacity="0.55"/>
          <ellipse cx="280" cy="730" rx="16" ry="6" fill="#f5e8c5" opacity="0.5"/>
        </svg>
        <!-- Layer 2 中景：飘动气球（lobby 主题色黄系，6B 主题色化）-->
        <svg class="bg-layer bg-layer-2" viewBox="0 0 320 800" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="50" cy="60" rx="6" ry="8" fill="#f5cd2f" opacity="0.7"/>
          <line x1="50" y1="70" x2="50" y2="120" stroke="#999" stroke-width="0.5" opacity="0.6"/>
          <ellipse cx="130" cy="80" rx="5" ry="7" fill="#f7d75c" opacity="0.7"/>
          <line x1="130" y1="89" x2="130" y2="140" stroke="#999" stroke-width="0.5" opacity="0.6"/>
          <ellipse cx="220" cy="50" rx="6" ry="8" fill="#fff3a8" opacity="0.7"/>
          <line x1="220" y1="60" x2="220" y2="110" stroke="#999" stroke-width="0.5" opacity="0.6"/>
          <ellipse cx="280" cy="75" rx="5" ry="7" fill="#f5cd2f" opacity="0.6"/>
          <line x1="280" y1="84" x2="280" y2="135" stroke="#999" stroke-width="0.5" opacity="0.6"/>
          <!-- 下半 letterbox 气球 -->
          <ellipse cx="60" cy="680" rx="6" ry="8" fill="#f7d75c" opacity="0.7"/>
          <line x1="60" y1="690" x2="60" y2="740" stroke="#999" stroke-width="0.5" opacity="0.6"/>
          <ellipse cx="180" cy="720" rx="5" ry="7" fill="#f5cd2f" opacity="0.7"/>
          <line x1="180" y1="729" x2="180" y2="770" stroke="#999" stroke-width="0.5" opacity="0.6"/>
          <ellipse cx="270" cy="690" rx="6" ry="8" fill="#fff3a8" opacity="0.6"/>
          <line x1="270" y1="700" x2="270" y2="750" stroke="#999" stroke-width="0.5" opacity="0.6"/>
        </svg>
        <!-- Layer 3 近景：闪烁小星 + 慢速彩屑（15s 漂）-->
        <svg class="bg-layer bg-layer-3" viewBox="0 0 320 800" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
          <polygon points="60,40 63,46 69,46 64,50 67,56 60,52 53,56 56,50 51,46 57,46" fill="#f7d75c">
            <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
          </polygon>
          <polygon points="180,80 182,84 187,84 184,87 186,91 180,88 174,91 176,87 173,84 178,84" fill="#f7d75c">
            <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
          </polygon>
          <polygon points="270,55 273,61 279,61 274,65 277,71 270,67 263,71 266,65 261,61 267,61" fill="#f7d75c">
            <animate attributeName="opacity" values="0.5;1;0.5" dur="2.2s" repeatCount="indefinite"/>
          </polygon>
          <!-- 下半 letterbox 星点 -->
          <polygon points="50,720 52,724 57,724 53,727 55,731 50,728 45,731 47,727 43,724 48,724" fill="#f7d75c">
            <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
          </polygon>
          <polygon points="200,760 202,764 207,764 203,767 205,771 200,768 195,771 197,767 193,764 198,764" fill="#f7d75c">
            <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
          </polygon>
          <polygon points="280,710 282,714 287,714 283,717 285,721 280,718 275,721 277,717 273,714 278,714" fill="#f7d75c">
            <animate attributeName="opacity" values="0.5;1;0.5" dur="2.2s" repeatCount="indefinite"/>
          </polygon>
          <circle cx="100" cy="100" r="2" fill="#e94f4f" opacity="0.6"/>
          <circle cx="200" cy="30" r="2" fill="#5DADE2" opacity="0.6"/>
          <circle cx="80" cy="750" r="2" fill="#2fa84f" opacity="0.6"/>
        </svg>
      </div>
      <div class="letterbox-bg" data-bg="match" aria-hidden="true">
        <!-- Phase 6C match: 阳光 + 秋叶 / 气球 + 飘带 / 上升星 + 彩屑
             元素全部集中在 letterbox 区域 (cy 0-75 上半 / cy 728-800 下半)
             中间 canvas 区域（cy 80-720）不放元素（被 cream 画布覆盖）-->
        <!-- Layer 1 远景（60s 漂）：上半阳光 + 4 片秋叶（上下半各 2）-->
        <svg class="bg-layer bg-layer-1" viewBox="0 0 320 800" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" style="background: #cd5e1f">
          <!-- 上半 letterbox 阳光：1 主体 + 3 层光晕 -->
          <circle cx="240" cy="35" r="22" fill="#fff3a8" opacity="0.9"/>
          <circle cx="240" cy="35" r="32" fill="#f7d75c" opacity="0.35"/>
          <circle cx="240" cy="35" r="45" fill="#f7d75c" opacity="0.2"/>
          <circle cx="240" cy="35" r="60" fill="#f7d75c" opacity="0.1"/>
          <!-- 上半 2 片秋叶 -->
          <path d="M 30 40 q 7 -9 14 0 q 7 9 0 16 q -7 9 -14 0 q -7 -9 0 -16 z" fill="#f7d75c" opacity="0.85" transform="rotate(20 37 48)"/>
          <path d="M 100 65 q 6 -8 12 0 q 6 8 0 14 q -6 8 -12 0 q -6 -8 0 -14 z" fill="#fff3a8" opacity="0.8" transform="rotate(-30 106 72)"/>
          <!-- 下半 2 片秋叶 -->
          <path d="M 160 750 q 6 -8 12 0 q 6 8 0 14 q -6 8 -12 0 q -6 -8 0 -14 z" fill="#fff3a8" opacity="0.85" transform="rotate(45 166 757)"/>
          <path d="M 60 785 q 7 -9 14 0 q 7 9 0 16 q -7 9 -14 0 q -7 -9 0 -16 z" fill="#f7d75c" opacity="0.8" transform="rotate(60 67 793)"/>
        </svg>
        <!-- Layer 2 中景（30s 漂）：上半 3 气球 + 下半 3 气球 + 2 飘带 -->
        <svg class="bg-layer bg-layer-2" viewBox="0 0 320 800" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" style="background: #cd5e1f">
          <!-- 上半 letterbox 气球 3 个 -->
          <ellipse cx="30" cy="30" rx="7" ry="9" fill="#fff3a8" opacity="0.95"/>
          <line x1="30" y1="40" x2="30" y2="72" stroke="#3d2410" stroke-width="0.6" opacity="0.5"/>
          <ellipse cx="100" cy="50" rx="7" ry="9" fill="#ffffff" opacity="0.95"/>
          <line x1="100" y1="60" x2="100" y2="72" stroke="#3d2410" stroke-width="0.6" opacity="0.5"/>
          <ellipse cx="170" cy="25" rx="7" ry="9" fill="#f7d75c" opacity="0.95"/>
          <line x1="170" y1="35" x2="170" y2="70" stroke="#3d2410" stroke-width="0.6" opacity="0.5"/>
          <!-- 下半 letterbox 气球 3 个 -->
          <ellipse cx="60" cy="745" rx="7" ry="9" fill="#ffffff" opacity="0.95"/>
          <line x1="60" y1="755" x2="60" y2="790" stroke="#3d2410" stroke-width="0.6" opacity="0.5"/>
          <ellipse cx="145" cy="755" rx="7" ry="9" fill="#fff3a8" opacity="0.95"/>
          <line x1="145" y1="765" x2="145" y2="795" stroke="#3d2410" stroke-width="0.6" opacity="0.5"/>
          <ellipse cx="230" cy="740" rx="7" ry="9" fill="#f7d75c" opacity="0.95"/>
          <line x1="230" y1="750" x2="230" y2="788" stroke="#3d2410" stroke-width="0.6" opacity="0.5"/>
          <!-- 2 条飘带（短弯曲，位于 letterbox 区域）-->
          <path d="M 80 30 q 8 15 -3 28" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
          <path d="M 240 740 q -8 18 3 32" stroke="#fff3a8" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
        </svg>
        <!-- Layer 3 近景（15s 漂）：6 星 + 6 彩点（全部 letterbox 区域）-->
        <svg class="bg-layer bg-layer-3" viewBox="0 0 320 800" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" style="background: #cd5e1f">
          <!-- 上半 3 星 -->
          <polygon points="40,30 42,36 48,36 43,40 45,46 40,42 35,46 37,40 32,36 38,36" fill="#ffffff">
            <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
          </polygon>
          <polygon points="140,55 141,59 145,59 142,61 143,65 140,63 137,65 138,61 135,59 139,59" fill="#ffffff">
            <animate attributeName="opacity" values="1;0.5;1" dur="1.8s" repeatCount="indefinite"/>
          </polygon>
          <polygon points="200,30 202,36 208,36 203,40 205,46 200,42 195,46 197,40 192,36 198,36" fill="#fff3a8">
            <animate attributeName="opacity" values="0.6;1;0.6" dur="2.2s" repeatCount="indefinite"/>
          </polygon>
          <!-- 下半 3 星 -->
          <polygon points="35,755 37,761 43,761 38,765 40,771 35,767 30,771 32,765 27,761 33,761" fill="#ffffff">
            <animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/>
          </polygon>
          <polygon points="170,775 172,781 178,781 173,785 175,791 170,787 165,791 167,785 162,781 168,781" fill="#fff3a8">
            <animate attributeName="opacity" values="1;0.5;1" dur="1.6s" repeatCount="indefinite"/>
          </polygon>
          <polygon points="260,760 262,766 268,766 263,770 265,776 260,772 255,776 257,770 252,766 258,766" fill="#ffffff">
            <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
          </polygon>
          <!-- 上半 3 彩点（上下浮动但不出 letterbox）-->
          <circle cx="65" cy="50" r="2.5" fill="#ffffff" opacity="0.85">
            <animate attributeName="cy" values="60;30;60" dur="5s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.4;0.9;0.4" dur="5s" repeatCount="indefinite"/>
          </circle>
          <circle cx="125" cy="30" r="2" fill="#fff3a8" opacity="0.85">
            <animate attributeName="cy" values="40;15;40" dur="6s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.4;0.9;0.4" dur="6s" repeatCount="indefinite"/>
          </circle>
          <circle cx="265" cy="55" r="2.5" fill="#ffffff" opacity="0.85">
            <animate attributeName="cy" values="65;35;65" dur="4.5s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4.5s" repeatCount="indefinite"/>
          </circle>
          <!-- 下半 3 彩点 -->
          <circle cx="90" cy="765" r="2.5" fill="#ffffff" opacity="0.85">
            <animate attributeName="cy" values="780;745;780" dur="5.5s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.4;0.9;0.4" dur="5.5s" repeatCount="indefinite"/>
          </circle>
          <circle cx="195" cy="745" r="2" fill="#fff3a8" opacity="0.85">
            <animate attributeName="cy" values="760;730;760" dur="6.5s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.4;0.9;0.4" dur="6.5s" repeatCount="indefinite"/>
          </circle>
          <circle cx="115" cy="780" r="2.5" fill="#ffffff" opacity="0.85">
            <animate attributeName="cy" values="795;755;795" dur="5s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.4;0.9;0.4" dur="5s" repeatCount="indefinite"/>
          </circle>
        </svg>
      </div>
      <div class="letterbox-bg" data-bg="memory" aria-hidden="true">
        <!-- Phase 6C memory: 星空 + 弯月 / 萤火 + 星云 / 水晶 + 流星
             配色：深紫底 (#5d2fa0) + 浅紫/白高对比元素 -->
        <!-- Layer 1 远景（60s 漂）：弯月 + 5 点星空 -->
        <svg class="bg-layer bg-layer-1" viewBox="0 0 320 800" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" style="background: #5d2fa0">
          <!-- 上半 letterbox 弯月（path 画弧月）-->
          <path d="M 240 30 a 25 25 0 1 0 0 50 a 18 18 0 1 1 0 -50 z" fill="#e0d4ff" opacity="0.9"/>
          <!-- 上半 2 点紫星 -->
          <circle cx="40" cy="45" r="2.5" fill="#c9b3ff" opacity="0.85"/>
          <circle cx="100" cy="30" r="2" fill="#e0d4ff" opacity="0.9"/>
          <!-- 上半 1 颗亮星 + 2 层光晕 -->
          <circle cx="160" cy="55" r="3" fill="#ffffff" opacity="0.95"/>
          <circle cx="160" cy="55" r="6" fill="#c9b3ff" opacity="0.4"/>
          <circle cx="160" cy="55" r="10" fill="#c9b3ff" opacity="0.2"/>
          <!-- 下半 2 点紫星 -->
          <circle cx="60" cy="755" r="2.5" fill="#c9b3ff" opacity="0.85"/>
          <circle cx="195" cy="780" r="2" fill="#e0d4ff" opacity="0.9"/>
          <!-- 下半 1 颗亮星 + 2 层光晕 -->
          <circle cx="270" cy="745" r="3" fill="#ffffff" opacity="0.95"/>
          <circle cx="270" cy="745" r="6" fill="#c9b3ff" opacity="0.4"/>
          <circle cx="270" cy="745" r="10" fill="#c9b3ff" opacity="0.2"/>
        </svg>
        <!-- Layer 2 中景（30s 漂）：紫萤火 + 星云飘带 -->
        <svg class="bg-layer bg-layer-2" viewBox="0 0 320 800" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" style="background: #5d2fa0">
          <!-- 上半 2 萤火（4 圈光晕） -->
          <circle cx="50" cy="35" r="6" fill="#ffffff" opacity="0.5"/>
          <circle cx="50" cy="35" r="3" fill="#e0d4ff" opacity="0.95"/>
          <circle cx="50" cy="35" r="1.5" fill="#ffffff" opacity="1"/>
          <circle cx="130" cy="60" r="6" fill="#ffffff" opacity="0.5"/>
          <circle cx="130" cy="60" r="3" fill="#e0d4ff" opacity="0.95"/>
          <circle cx="130" cy="60" r="1.5" fill="#ffffff" opacity="1"/>
          <!-- 下半 2 萤火 -->
          <circle cx="170" cy="750" r="6" fill="#ffffff" opacity="0.5"/>
          <circle cx="170" cy="750" r="3" fill="#e0d4ff" opacity="0.95"/>
          <circle cx="170" cy="750" r="1.5" fill="#ffffff" opacity="1"/>
          <circle cx="95" cy="775" r="6" fill="#ffffff" opacity="0.5"/>
          <circle cx="95" cy="775" r="3" fill="#e0d4ff" opacity="0.95"/>
          <circle cx="95" cy="775" r="1.5" fill="#ffffff" opacity="1"/>
          <!-- 2 条星云飘带 -->
          <path d="M 200 30 q 15 12 0 25 q -15 13 0 22" stroke="#c9b3ff" stroke-width="2" fill="none" opacity="0.45" stroke-linecap="round"/>
          <path d="M 30 750 q 12 10 -3 22 q -15 12 5 25" stroke="#e0d4ff" stroke-width="2" fill="none" opacity="0.45" stroke-linecap="round"/>
        </svg>
        <!-- Layer 3 近景（15s 漂）：闪烁水晶 + 流星 -->
        <svg class="bg-layer bg-layer-3" viewBox="0 0 320 800" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" style="background: #5d2fa0">
          <!-- 上半 3 个闪烁水晶（菱形 + animate） -->
          <polygon points="35,30 38,38 35,46 32,38" fill="#ffffff">
            <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/>
          </polygon>
          <polygon points="105,55 109,63 105,71 101,63" fill="#e0d4ff">
            <animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/>
          </polygon>
          <polygon points="200,30 204,38 200,46 196,38" fill="#ffffff">
            <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
          </polygon>
          <!-- 下半 3 个闪烁水晶 -->
          <polygon points="50,755 54,763 50,771 46,763" fill="#e0d4ff">
            <animate attributeName="opacity" values="0.5;1;0.5" dur="2.3s" repeatCount="indefinite"/>
          </polygon>
          <polygon points="155,780 159,788 155,796 151,788" fill="#ffffff">
            <animate attributeName="opacity" values="1;0.4;1" dur="1.7s" repeatCount="indefinite"/>
          </polygon>
          <polygon points="255,745 259,753 255,761 251,753" fill="#e0d4ff">
            <animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/>
          </polygon>
          <!-- 2 个流星（动画 cy 漂落） -->
          <line x1="80" y1="30" x2="80" y2="55" stroke="#ffffff" stroke-width="1.5" opacity="0.85">
            <animate attributeName="y1" values="-10;30;-10" dur="5s" repeatCount="indefinite"/>
            <animate attributeName="y2" values="15;55;15" dur="5s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0;0.9;0" dur="5s" repeatCount="indefinite"/>
          </line>
          <line x1="225" y1="755" x2="225" y2="780" stroke="#e0d4ff" stroke-width="1.5" opacity="0.85">
            <animate attributeName="y1" values="715;755;715" dur="6s" repeatCount="indefinite"/>
            <animate attributeName="y2" values="740;780;740" dur="6s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0;0.9;0" dur="6s" repeatCount="indefinite"/>
          </line>
          <!-- 4 个小闪烁点 -->
          <circle cx="65" cy="60" r="1.5" fill="#ffffff" opacity="0.85">
            <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
          </circle>
          <circle cx="240" cy="40" r="1.5" fill="#e0d4ff" opacity="0.85">
            <animate attributeName="opacity" values="1;0.3;1" dur="3.5s" repeatCount="indefinite"/>
          </circle>
          <circle cx="100" cy="775" r="1.5" fill="#ffffff" opacity="0.85">
            <animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite"/>
          </circle>
          <circle cx="285" cy="780" r="1.5" fill="#e0d4ff" opacity="0.85">
            <animate attributeName="opacity" values="1;0.3;1" dur="3.8s" repeatCount="indefinite"/>
          </circle>
        </svg>
      </div>
      <div class="letterbox-bg" data-bg="pinyinFriend" aria-hidden="true">
        <!-- Phase 6C pinyinFriend: 白云 + 彩虹 / 纸飞机 + 雨滴 / 蝴蝶 + 雪花
             配色：深蓝底 (#1a5fb4) + 浅蓝/白/彩虹色高对比元素 -->
        <!-- Layer 1 远景（60s 漂）：彩虹弧 + 3 朵白云 -->
        <svg class="bg-layer bg-layer-1" viewBox="0 0 320 800" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" style="background: #1a5fb4">
          <!-- 上半彩虹弧（6 色 stroke arc，弧顶裁出上半 letterbox，仅底部弧可见） -->
          <path d="M 60 70 a 100 100 0 0 1 200 0" stroke="#ff6b6b" stroke-width="3.5" fill="none" opacity="1"/>
          <path d="M 70 70 a 90 90 0 0 1 180 0" stroke="#ffa94d" stroke-width="3.5" fill="none" opacity="1"/>
          <path d="M 80 70 a 80 80 0 0 1 160 0" stroke="#ffd43b" stroke-width="3.5" fill="none" opacity="1"/>
          <path d="M 90 70 a 70 70 0 0 1 140 0" stroke="#69db7c" stroke-width="3.5" fill="none" opacity="1"/>
          <path d="M 100 70 a 60 60 0 0 1 120 0" stroke="#4dabf7" stroke-width="3.5" fill="none" opacity="1"/>
          <path d="M 110 70 a 50 50 0 0 1 100 0" stroke="#9775fa" stroke-width="3.5" fill="none" opacity="1"/>
          <!-- 下半 3 朵白云（椭圆 + 椭圆） -->
          <g opacity="0.85">
            <ellipse cx="60" cy="755" rx="14" ry="8" fill="#ffffff"/>
            <ellipse cx="75" cy="750" rx="12" ry="9" fill="#ffffff"/>
            <ellipse cx="50" cy="752" rx="10" ry="7" fill="#ffffff"/>
          </g>
          <g opacity="0.85">
            <ellipse cx="180" cy="775" rx="12" ry="7" fill="#ffffff"/>
            <ellipse cx="195" cy="772" rx="10" ry="8" fill="#ffffff"/>
          </g>
          <g opacity="0.85">
            <ellipse cx="270" cy="755" rx="13" ry="8" fill="#ffffff"/>
            <ellipse cx="258" cy="752" rx="11" ry="7" fill="#ffffff"/>
          </g>

          <circle cx="180" cy="55" r="2.5" fill="#2dd4bf" opacity="0.7"/>
          <circle cx="80" cy="65" r="1.5" fill="#99f6e4" opacity="0.6"/>

        </svg>
        <!-- Layer 2 中景（30s 漂）：青绿萤火（letterbox 区域 7 颗，呼吸闪烁）-->
        <svg class="bg-layer bg-layer-2" viewBox="0 0 320 800" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" style="background: #134e4a">

        <!-- Layer 3 近景（15s 漂）：青绿水晶 + 闪烁星（letterbox 区域）-->
        <svg class="bg-layer bg-layer-3" viewBox="0 0 320 800" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" style="background: #134e4a">
          <!-- 上半 letterbox 青绿水晶（六边形） -->
          <polygon points="60,30 70,40 70,55 60,65 50,55 50,40" fill="#2dd4bf" opacity="0.85">
            <animate attributeName="opacity" values="0.7;1;0.7" dur="1.6s" repeatCount="indefinite"/>

            <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
          </polygon>
          <!-- 下半 letterbox 青绿水晶 -->
          <polygon points="80,735 88,743 88,755 80,763 72,755 72,743" fill="#14b8a6" opacity="0.85">
            <animate attributeName="opacity" values="0.7;1;0.7" dur="1.8s" repeatCount="indefinite"/>
          </polygon>
          <polygon points="240,725 250,735 250,750 240,760 230,750 230,735" fill="#2dd4bf" opacity="0.85">
            <animate attributeName="opacity" values="1;0.6;1" dur="1.7s" repeatCount="indefinite"/>
          </polygon>
          <!-- 下半 letterbox 闪烁星 -->
          <polygon points="160,765 162,769 166,769 163,772 165,776 160,773 155,776 157,772 154,769 158,769" fill="#ccfbf1">
            <animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite"/>
          </polygon>
          <!-- 几个小彩点（点缀） -->
          <circle cx="135" cy="45" r="2" fill="#99f6e4" opacity="0.85"/>
          <circle cx="280" cy="745" r="2" fill="#5eead4" opacity="0.85"/>
        </svg>
      </div>
      <div class="stage-canvas">
        <main class="app" aria-live="polite">
      <section id="lobby" class="screen active" aria-labelledby="lobby-title">
        <div class="topbar">
          <div>
            <p class="eyebrow">幼小衔接</p>
            <h1 id="lobby-title">识字小游戏</h1>
          </div>
          <div class="topbar-right">
            <button id="open-voice-picker" class="icon-button" type="button" aria-label="选声音" title="选声音">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
            </button>
            <!-- Phase 2A：mascot 从顶栏移到 lobby 主体右下角，作为"陪伴吉祥物" -->
          </div>
        </div>

        <div class="game-list">
          <button id="open-match" class="game-entry clickable focus-ring" type="button">
            <span class="entry-icon" aria-hidden="true">
              <img src="assets/icon-match.svg" alt="" />
            </span>
            <span class="entry-text">
              <span class="entry-title">识字消消乐</span>
              <span class="entry-copy">找一找相同的字</span>
            </span>
          </button>
          <button id="open-memory" class="game-entry clickable focus-ring" type="button">
            <span class="entry-icon" aria-hidden="true">
              <img src="assets/icon-memory.svg" alt="" />
            </span>
            <span class="entry-text">
              <span class="entry-title">识字翻翻乐</span>
              <span class="entry-copy">记一记，再翻出来</span>
            </span>
          </button>
          <button id="open-pinyin-friend" class="game-entry clickable focus-ring" type="button">
            <span class="entry-icon" aria-hidden="true">
              <img src="assets/icon-pinyin-friend.svg" alt="" />
            </span>
            <span class="entry-text">
              <span class="entry-title">拼音找朋友</span>
              <span class="entry-copy">听一听，选拼音</span>
            </span>
          </button>
          <button id="open-listen-card" class="game-entry clickable focus-ring" type="button">
            <span class="entry-icon" aria-hidden="true">
              <img src="assets/icon-listen-card.svg" alt="" />
            </span>
            <span class="entry-text">
              <span class="entry-title">听音点卡</span>
              <span class="entry-copy">听一听，点拼音</span>
            </span>
          </button>
          <button id="open-stroop-train" class="game-entry clickable focus-ring" type="button">
            <span class="entry-icon" aria-hidden="true">
              <img src="assets/icon-stroop-train.svg" alt="" />
            </span>
            <span class="entry-text">
              <span class="entry-title">看字识颜色</span>
              <span class="entry-copy">字是什么颜色</span>
            </span>
          </button>
          <!-- Phase 8A — 成语填空（idiomFill）入口 -->
          <button id="open-idiom-fill" class="game-entry clickable focus-ring" type="button">
            <span class="entry-icon" aria-hidden="true">
              <img src="assets/icon-idiom-fill.svg" alt="" />
            </span>
            <span class="entry-text">
              <span class="entry-title">成语填空</span>
              <span class="entry-copy">把成语填完整</span>
            </span>
          </button>
        </div>

        <!-- Phase 2A：lobby 主体右下角浮动 mascot（letterbox 内） -->
        <img class="mascot-companion" src="assets/mascot-wave.svg" alt="小书本" />
      </section>

      <section id="setup" class="screen" aria-labelledby="setup-title">
        <div class="topbar compact">
          <button class="text-button" type="button" data-action="back-lobby">返回</button>
          <h2 id="setup-title">选择难度</h2>
        </div>

        <div class="difficulty-grid" role="list" aria-label="难度选择">
          <button class="difficulty" type="button" data-size="3">
            <strong>3 x 3</strong>
            <span>轻松开始</span>
          </button>
          <button class="difficulty" type="button" data-size="4">
            <strong>4 x 4</strong>
            <span>多认几个</span>
          </button>
          <button class="difficulty" type="button" data-size="5">
            <strong>5 x 5</strong>
            <span>挑战一下</span>
          </button>
          <button class="difficulty" type="button" data-size="6">
            <strong>6 x 6</strong>
            <span>越来越难</span>
          </button>
          <button class="difficulty" type="button" data-size="7">
            <strong>7 x 7</strong>
            <span>极限挑战</span>
          </button>
        </div>
      </section>

      <section id="game" class="screen" aria-labelledby="game-title">
        <div class="game-topbar">
          <button class="text-button" type="button" data-action="back-setup">换难度</button>
          <div>
            <p id="game-subtitle" class="eyebrow">识字消消乐</p>
            <h2 id="game-title">找到相同的字</h2>
          </div>
          <div class="game-topbar-right">
            <img class="mascot-host game-mascot" src="assets/mascot-wave.svg" alt="小书本" />
            <button id="replay-sound" class="round-button" type="button" aria-label="再听一遍">听</button>
          </div>
        </div>

        <div class="game-hud" aria-label="游戏状态">
          <span id="progress" class="hud-progress">0 / 0</span>
          <span id="timer" class="hud-timer">00:00</span>
          <span id="hint" class="hud-hint">点一个字，听一听</span>
        </div>

        <div id="board" class="board zone-primary" role="grid" aria-label="识字消消乐棋盘"></div>

        <!-- 看字识颜色：棋盘 + 待选 + 颜色条 -->
        <div id="stroop-host" class="stroop-host zone-stack" hidden>
          <div id="stroop-board" class="stroop-board zone-primary" role="grid" aria-label="看字识颜色棋盘"></div>
          <div id="stroop-select" class="stroop-select zone-secondary" role="grid" aria-label="待选区（依次填入棋盘每格的颜色）"></div>
          <div id="stroop-palette" class="stroop-palette zone-toolbar" role="group" aria-label="颜色条（选颜色填入待选）"></div>
        </div>

        <!-- Phase 8A — 成语填空：滚筒 + 候选字池（zone-stack：滚筒 primary + 候选字池 secondary）-->
        <div id="idiom-host" class="idiom-host zone-stack" hidden>
          <div id="idiom-track" class="idiom-track zone-primary" aria-label="成语滚筒（每次突出一个成语）">
            <!-- 滚筒内部由 renderIdiomFill() 动态生成 .idiom-row -->
          </div>
          <div id="idiom-pool" class="idiom-pool zone-secondary" aria-label="候选字池（点候选字填入成语空格）">
            <!-- 候选字池由 renderIdiomFill() 动态生成 .candidate-tile -->
          </div>
        </div>

        <div id="quiz" class="quiz zone-stack" hidden>
          <div id="quiz-main" class="quiz-main zone-primary" aria-live="polite"></div>
          <div id="option-grid" class="option-grid zone-secondary" role="list" aria-label="拼音选项"></div>
        </div>

        <div id="complete-panel" class="complete-panel" hidden>
          <!-- Phase 4A: 奖杯 + 星星 + 统计 -->
          <div class="trophy-row" aria-hidden="true">
            <!-- 3 档奖杯，init 全部 hidden，完成时按档位显示 1 档 -->
            <div class="trophy" data-tier="bronze" hidden>
              <svg class="trophy-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M8 18c-4 0-4 10 0 10" stroke="#cd7f32" stroke-width="3" fill="none" stroke-linecap="round"/>
                <path d="M56 18c4 0 4 10 0 10" stroke="#cd7f32" stroke-width="3" fill="none" stroke-linecap="round"/>
                <path d="M16 12h32v18c0 8-7 14-16 14s-16-6-16-14V12z" fill="#cd7f32"/>
                <path d="M16 12h32v3H16z" fill="#e89858"/>
                <rect x="24" y="44" width="16" height="4" fill="#a6611f"/>
                <rect x="18" y="48" width="28" height="6" rx="1" fill="#8b4a0f"/>
                <text x="32" y="32" text-anchor="middle" font-size="14" font-weight="900" fill="#fff8d8" font-family="system-ui">3</text>
              </svg>
            </div>
            <div class="trophy" data-tier="silver" hidden>
              <svg class="trophy-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M8 18c-4 0-4 10 0 10" stroke="#c0c0c0" stroke-width="3" fill="none" stroke-linecap="round"/>
                <path d="M56 18c4 0 4 10 0 10" stroke="#c0c0c0" stroke-width="3" fill="none" stroke-linecap="round"/>
                <path d="M16 12h32v18c0 8-7 14-16 14s-16-6-16-14V12z" fill="#d4d4d4"/>
                <path d="M16 12h32v3H16z" fill="#f0f0f0"/>
                <rect x="24" y="44" width="16" height="4" fill="#a0a0a0"/>
                <rect x="18" y="48" width="28" height="6" rx="1" fill="#808080"/>
                <text x="32" y="32" text-anchor="middle" font-size="14" font-weight="900" fill="#fff" font-family="system-ui">2</text>
              </svg>
            </div>
            <div class="trophy" data-tier="gold" hidden>
              <svg class="trophy-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M8 18c-4 0-4 10 0 10" stroke="#f7d75c" stroke-width="3" fill="none" stroke-linecap="round"/>
                <path d="M56 18c4 0 4 10 0 10" stroke="#f7d75c" stroke-width="3" fill="none" stroke-linecap="round"/>
                <path d="M16 12h32v18c0 8-7 14-16 14s-16-6-16-14V12z" fill="#f7d75c"/>
                <path d="M16 12h32v3H16z" fill="#fff3a8"/>
                <rect x="24" y="44" width="16" height="4" fill="#d4a72c"/>
                <rect x="18" y="48" width="28" height="6" rx="1" fill="#a3780f"/>
                <text x="32" y="32" text-anchor="middle" font-size="14" font-weight="900" fill="#5a4500" font-family="system-ui">1</text>
              </svg>
            </div>
          </div>
          <!-- 3 颗星：完成时按 earned 数标记 -->
          <div class="star-row" aria-label="星星数">
            <svg class="star" data-star="1" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 2L14.85 8.5L22 9.27L16.5 14.14L18.18 21L12 17.27L5.82 21L7.5 14.14L2 9.27L9.15 8.5L12 2Z"/>
            </svg>
            <svg class="star" data-star="2" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 2L14.85 8.5L22 9.27L16.5 14.14L18.18 21L12 17.27L5.82 21L7.5 14.14L2 9.27L9.15 8.5L12 2Z"/>
            </svg>
            <svg class="star" data-star="3" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 2L14.85 8.5L22 9.27L16.5 14.14L18.18 21L12 17.27L5.82 21L7.5 14.14L2 9.27L9.15 8.5L12 2Z"/>
            </svg>
          </div>
          <p class="complete-title">都找到了</p>
          <p id="complete-stats" class="complete-stats">用时 00:00 · 成功率 0 / 0（0%）</p>
          <p id="best-record" class="complete-record" hidden>新纪录！</p>
          <div class="actions">
            <button id="play-again" class="primary-button" type="button">再玩一次</button>
            <button id="next-board" class="secondary-button" type="button" hidden>下一关</button>
            <button class="secondary-button" type="button" data-action="back-lobby">回大厅</button>
          </div>
        </div>
      </section>
    </main>
      </div>
    </div>

    <!-- Phase 7B: 6 首 BGM（lobby/match/memory/pinyinFriend/listenCard/stroopTrain），由 app.js bgmController 控制播放/暂停/duck -->
    <audio id="bgm-lobby" src="assets/music/lobby.mp3" loop preload="auto"></audio>
    <audio id="bgm-match" src="assets/music/match.mp3" loop preload="auto"></audio>
    <audio id="bgm-memory" src="assets/music/memory.mp3" loop preload="auto"></audio>
    <audio id="bgm-pinyinFriend" src="assets/music/pinyinFriend.mp3" loop preload="auto"></audio>
    <audio id="bgm-listenCard" src="assets/music/listenCard.mp3" loop preload="auto"></audio>
    <audio id="bgm-stroopTrain" src="assets/music/stroopTrain.mp3" loop preload="auto"></audio>

    <!-- Voice picker modal: body-level, position:fixed, NOT inside .stage-canvas (避免被 transform scale 压住) -->
    <div id="voice-picker" class="voice-modal" hidden role="dialog" aria-labelledby="voice-picker-title" aria-modal="true">
      <div class="voice-modal-backdrop" data-close="voice-picker"></div>
      <div class="voice-modal-panel">
        <div class="voice-modal-head">
          <h2 id="voice-picker-title">选个喜欢的声音</h2>
          <button class="icon-button icon-button-sm" type="button" data-close="voice-picker" aria-label="关闭">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
          </button>
        </div>
        <p class="voice-modal-hint">点一行试听，喜欢就定了</p>
        <div id="voice-list" class="voice-list" role="list"></div>
        <!-- Phase 7B: 背景音乐开关（独立于音色选择）-->
        <div class="bgm-toggle-row">
          <span class="bgm-toggle-label">🎵 背景音乐</span>
          <button id="bgm-toggle" class="toggle-switch" type="button" role="switch" aria-checked="true" aria-label="背景音乐">
            <span class="toggle-knob"></span>
          </button>
        </div>
      </div>
    </div>

    <script src="assets/audio/manifest.js"></script>
    <script src="scripts/stage.js"></script>
    <script src="engine/marquee.js?v=stroop-marquee"></script>
    <script src="app.js" defer></script>
  </body>
