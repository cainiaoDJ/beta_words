<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
    <title>幼小衔接识字游戏</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/svg+xml" href="assets/mascot.svg" />
    <link rel="icon" type="image/png" sizes="128x128" href="favicon.png" />
  </head>
  <body>
    <div class="stage">
      <div class="stage-canvas">
        <main class="app" aria-live="polite">
      <section id="lobby" class="screen active" aria-labelledby="lobby-title">
        <div class="topbar">
          <div>
            <p class="eyebrow">幼小衔接</p>
            <h1 id="lobby-title">识字小游戏</h1>
          </div>
          <img class="mascot-host" src="assets/mascot-wave.svg" alt="小书本招手" />
        </div>

        <div class="game-list">
          <button id="open-match" class="game-entry clickable focus-ring" type="button">
            <span class="entry-icon" aria-hidden="true">
              <img src="assets/icon-match.svg" alt="" />
            </span>
            <span class="entry-text">
              <span class="entry-title">识字消消乐</span>
              <span class="entry-copy">找一找相同的字</span>
            </span>
          </button>
          <button id="open-memory" class="game-entry clickable focus-ring" type="button">
            <span class="entry-icon" aria-hidden="true">
              <img src="assets/icon-memory.svg" alt="" />
            </span>
            <span class="entry-text">
              <span class="entry-title">识字翻翻乐</span>
              <span class="entry-copy">记一记，再翻出来</span>
            </span>
          </button>
          <button id="open-pinyin-friend" class="game-entry clickable focus-ring" type="button">
            <span class="entry-icon" aria-hidden="true">
              <img src="assets/icon-pinyin-friend.svg" alt="" />
            </span>
            <span class="entry-text">
              <span class="entry-title">拼音找朋友</span>
              <span class="entry-copy">听一听，选拼音</span>
            </span>
          </button>
          <button id="open-listen-card" class="game-entry clickable focus-ring" type="button">
            <span class="entry-icon" aria-hidden="true">
              <img src="assets/icon-listen-card.svg" alt="" />
            </span>
            <span class="entry-text">
              <span class="entry-title">听音点卡</span>
              <span class="entry-copy">听一听，点拼音</span>
            </span>
          </button>
          <button id="open-stroop-train" class="game-entry clickable focus-ring" type="button">
            <span class="entry-icon" aria-hidden="true">
              <img src="assets/icon-stroop-train.svg" alt="" />
            </span>
            <span class="entry-text">
              <span class="entry-title">看字识颜色</span>
              <span class="entry-copy">字是什么颜色</span>
            </span>
          </button>
        </div>
      </section>

      <section id="setup" class="screen" aria-labelledby="setup-title">
        <div class="topbar compact">
          <button class="text-button" type="button" data-action="back-lobby">返回</button>
          <h2 id="setup-title">选择难度</h2>
        </div>

        <div class="difficulty-grid" role="list" aria-label="难度选择">
          <button class="difficulty" type="button" data-size="3">
            <strong>3 x 3</strong>
            <span>轻松开始</span>
          </button>
          <button class="difficulty" type="button" data-size="4">
            <strong>4 x 4</strong>
            <span>多认几个</span>
          </button>
          <button class="difficulty" type="button" data-size="5">
            <strong>5 x 5</strong>
            <span>挑战一下</span>
          </button>
          <button class="difficulty" type="button" data-size="6">
            <strong>6 x 6</strong>
            <span>越来越难</span>
          </button>
          <button class="difficulty" type="button" data-size="7">
            <strong>7 x 7</strong>
            <span>极限挑战</span>
          </button>
        </div>
      </section>

      <section id="game" class="screen" aria-labelledby="game-title">
        <div class="game-topbar">
          <button class="text-button" type="button" data-action="back-setup">换难度</button>
          <div>
            <p id="game-subtitle" class="eyebrow">识字消消乐</p>
            <h2 id="game-title">找到相同的字</h2>
          </div>
          <button id="replay-sound" class="round-button" type="button" aria-label="再听一遍">听</button>
        </div>

        <div class="game-hud" aria-label="游戏状态">
          <span id="progress" class="hud-progress">0 / 0</span>
          <span id="timer" class="hud-timer">00:00</span>
          <span id="hint" class="hud-hint">点一个字，听一听</span>
        </div>

        <div id="board" class="board zone-primary" role="grid" aria-label="识字消消乐棋盘"></div>

        <!-- 看字识颜色：棋盘 + 待选 + 颜色条 -->
        <div id="stroop-host" class="stroop-host zone-stack" hidden>
          <div id="stroop-board" class="stroop-board zone-primary" role="grid" aria-label="看字识颜色棋盘"></div>
          <div id="stroop-select" class="stroop-select zone-secondary" role="grid" aria-label="待选区（依次填入棋盘每格的颜色）"></div>
          <div id="stroop-palette" class="stroop-palette zone-toolbar" role="group" aria-label="颜色条（选颜色填入待选）"></div>
        </div>

        <div id="quiz" class="quiz zone-stack" hidden>
          <div id="quiz-main" class="quiz-main zone-primary" aria-live="polite"></div>
          <div id="option-grid" class="option-grid zone-secondary" role="list" aria-label="拼音选项"></div>
        </div>

        <div id="complete-panel" class="complete-panel" hidden>
          <p>都找到了</p>
          <p id="complete-time">本次用时 00:00</p>
          <p id="best-record" hidden>新纪录！</p>
          <div class="actions">
            <button id="play-again" class="primary-button" type="button">再玩一次</button>
            <button id="next-board" class="secondary-button" type="button" hidden>下一关</button>
            <button class="secondary-button" type="button" data-action="back-lobby">回大厅</button>
          </div>
        </div>
      </section>
    </main>
      </div>
    </div>

    <script src="assets/audio/manifest.js"></script>
    <script src="scripts/stage.js"></script>
    <script src="app.js" defer></script>
  </body>
</html>
