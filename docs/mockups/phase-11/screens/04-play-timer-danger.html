<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>算术闪卡 · Phase 11 设计稿</title>
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="../mockup.css" />
<link rel="stylesheet" href="../mockup-frame.css" />

</head>
<body data-game="mathFlash">
  <div class="stage">
    <div class="stage-canvas">
      <main class="app" aria-live="polite">

      <section id="game" class="screen active" aria-labelledby="game-title">

        <div class="game-topbar">
          <button class="text-button" type="button" data-action="back-setup">换关卡</button>
          <div>
            <p id="game-subtitle" class="eyebrow">算术闪卡</p>
            <h2 id="game-title">算一算，选答案</h2>
          </div>
          <div class="game-topbar-right">
            <img class="mascot-host game-mascot" src="../screens/assets/mascot-wave.svg" alt="小书本" />
            <button id="replay-sound" class="round-button" type="button" aria-label="再听一遍">听</button>
          </div>
        </div>

        <div class="game-hud" aria-label="游戏状态">
          <span id="progress" class="hud-progress">41 / 45</span>
          <span id="timer" class="hud-timer timed-danger">02:38</span>
          <span id="hint" class="hud-hint">选一个答案</span>
        </div>

        <div id="math-host" class="math-host zone-stack">

        <div class="math-flip-pair zone-primary">
          <div class="math-card">
            <div class="math-card__inner">
              <div class="math-card__face math-card__face--front">
                <div class="math-card__timer" hidden><i style="width:100%"></i></div>
                <div class="math-card__head"><span class="math-card__badge">20 以内加法</span><span class="math-card__label">第 41 题</span></div>
                <div class="math-eq"><span>9</span><span class="op">+</span><span>8</span><span class="op">=</span><span class="q">?</span></div>
              </div>
              <div class="math-card__face math-card__face--back">
                <div class="math-card__watermark">+ −</div>
              </div>
            </div>
          </div>
        </div>
<div id="math-options" class="option-grid zone-secondary" role="list" aria-label="答案选项"><button class="option-button math-option" type="button" role="listitem" aria-label="选项 16">16</button><button class="option-button math-option" type="button" role="listitem" aria-label="选项 17">17</button><button class="option-button math-option" type="button" role="listitem" aria-label="选项 18">18</button><button class="option-button math-option" type="button" role="listitem" aria-label="选项 15">15</button></div>
        </div>
      </section>

      </main>
    </div>
  </div>
</body>
</html>
