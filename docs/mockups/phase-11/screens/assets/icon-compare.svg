<?xml version="1.0" encoding="UTF-8"?>
<!-- 看图比大小 game icon (Phase 8B)
     概念: 3 个圆点 vs 1 个圆点, 中间 > -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- 左边 3 个圆 (多) -->
  <circle cx="10" cy="32" r="7" fill="#e94f4f"/>
  <circle cx="26" cy="32" r="7" fill="#e94f4f"/>
  <!-- 大于符号 -->
  <path d="M 36 22 L 50 32 L 36 42" stroke="#5d4a2a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 右边 1 个圆 (少) -->
  <circle cx="56" cy="32" r="7" fill="#2f80e9"/>
</svg>