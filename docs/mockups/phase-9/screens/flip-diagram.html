<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>翻卡动效分解</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="../mockup.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1180px;
    height: 420px;
    background: #f5f7f3;
    font-family: system-ui, -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif;
    padding: 28px 32px;
  }
  .diagram-title {
    font-size: 20px;
    font-weight: 900;
    color: #22302a;
    margin-bottom: 4px;
  }
  .diagram-sub {
    font-size: 13px;
    color: #5b6b62;
    margin-bottom: 26px;
  }
  .row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 18px;
  }
  .cell {
    flex: 0 0 244px;
    text-align: center;
  }
  .slot {
    position: relative;
    width: 236px;
    height: 142px;
    perspective: 900px;
    margin: 0 auto 14px;
  }
  .slot .math-card {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    aspect-ratio: auto;
  }
  .slot .math-card__inner { transition: none; }
  .slot.is-a .math-card__inner { transform: rotateY(0deg); }
  .slot.is-b .math-card__inner { transform: rotateY(-30deg); }
  .slot.is-c .math-card__inner { transform: rotateY(-65deg); }
  .slot.is-d .math-card__inner { transform: rotateY(-180deg); }
  .slot.is-d .math-card__face--front { opacity: 0; }
  .slot.is-d .math-card__face--back {
    transform: rotateY(180deg) rotate(-2deg);
    opacity: 1;
  }
  .cap {
    font-size: 15px;
    font-weight: 800;
    color: #22302a;
    margin-bottom: 4px;
  }
  .note {
    font-size: 12px;
    color: #5b6b62;
    line-height: 1.5;
  }
  .arrow {
    flex: 0 0 auto;
    align-self: center;
    font-size: 26px;
    color: #ec4899;
    font-weight: 900;
    margin-top: -22px;
  }
</style>
</head>
<body data-game="mathFlash">
  <h1 class="diagram-title">算术闪卡 · 翻卡动效分解</h1>
  <p class="diagram-sub">纸质名片卡（332×200，比例 1.66）绕 Y 轴翻转；翻页时旧卡翻走、下一题卡从背面转出，全程约 480ms。</p>
  <div class="row"><div class="cell"><div class="slot is-a">
            <div class="math-card">
              <div class="math-card__inner">
                <div class="math-card__face math-card__face--front">
                  <div class="math-card__head">
                    <span class="math-card__badge">10 以内加法</span>
                    <span class="math-card__label">第 2 题</span>
                  </div>
                  <div class="math-eq">
                    <span>4</span><span class="op">+</span><span>3</span>
                    <span class="op">=</span><span class="q">?</span>
                  </div>
                </div>
                <div class="math-card__face math-card__face--back">
                  <div class="math-card__watermark">6 + 7</div>
                </div>
              </div>
            </div></div><div class="cap">① 正面</div><div class="note">题目卡正面，纸质名片比例 332×200</div></div><div class="arrow">→</div><div class="cell"><div class="slot is-b">
            <div class="math-card">
              <div class="math-card__inner">
                <div class="math-card__face math-card__face--front">
                  <div class="math-card__head">
                    <span class="math-card__badge">10 以内加法</span>
                    <span class="math-card__label">第 2 题</span>
                  </div>
                  <div class="math-eq">
                    <span>4</span><span class="op">+</span><span>3</span>
                    <span class="op">=</span><span class="q">?</span>
                  </div>
                </div>
                <div class="math-card__face math-card__face--back">
                  <div class="math-card__watermark">6 + 7</div>
                </div>
              </div>
            </div></div><div class="cap">② 翻起 30°</div><div class="note">卡片绕 Y 轴抬起，纸面开始侧转</div></div><div class="arrow">→</div><div class="cell"><div class="slot is-c">
            <div class="math-card">
              <div class="math-card__inner">
                <div class="math-card__face math-card__face--front">
                  <div class="math-card__head">
                    <span class="math-card__badge">10 以内加法</span>
                    <span class="math-card__label">第 2 题</span>
                  </div>
                  <div class="math-eq">
                    <span>4</span><span class="op">+</span><span>3</span>
                    <span class="op">=</span><span class="q">?</span>
                  </div>
                </div>
                <div class="math-card__face math-card__face--back">
                  <div class="math-card__watermark">6 + 7</div>
                </div>
              </div>
            </div></div><div class="cap">③ 翻起 65°</div><div class="note">接近侧立，只剩窄条，透出纸卡折脊</div></div><div class="arrow">→</div><div class="cell"><div class="slot is-d">
            <div class="math-card">
              <div class="math-card__inner">
                <div class="math-card__face math-card__face--front"></div>
                <div class="math-card__face math-card__face--back">
                  <div class="math-card__watermark">6 + 7</div>
                </div>
              </div>
            </div></div><div class="cap">④ 背面</div><div class="note">背面素纸，露出新题（下一题）</div></div></div>
</body>
</html>
